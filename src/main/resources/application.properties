spring.application.name=repair-project
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/repair_management
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Stage 7: a NEW cryptographically secure secret is required; do not commit it.
# Generate locally with: openssl rand -base64 32
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=repair-management
app.jwt.audience=repair-management-web
app.jwt.access-token-minutes=720
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://wolftech.space}
# Origin allow-list for WebSocket upgrades. Keep production HTTPS host and local Angular host.
app.support.websocket.allowed-origins=${SUPPORT_WS_ALLOWED_ORIGINS:http://localhost:4200,https://wolftech.space}

# Persistent folder (mount a persistent volume here in Docker/VPS deployments).
app.images.storage-dir=${ITEM_IMAGES_DIR:./data/item-images}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB


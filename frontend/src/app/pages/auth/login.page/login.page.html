<main class="auth-layout auth-i18n" [attr.dir]="lang.language() === 'ar' ? 'rtl' : 'ltr'" [attr.lang]="lang.language()">
  <section class="auth-card auth-modern">
    <div class="auth-language" role="group" [attr.aria-label]="t('Language')">
      <button type="button" [class.selected]="lang.language() === 'en'" [attr.aria-pressed]="lang.language() === 'en'" (click)="setLanguage('en')">English</button>
      <button type="button" [class.selected]="lang.language() === 'ar'" [attr.aria-pressed]="lang.language() === 'ar'" (click)="setLanguage('ar')">العربية</button>
    </div>
    <div class="logo auth-brand">
      <img class="auth-wolf-logo" src="assets/wolflog-removebg-preview.png" alt="Wolf Tech Repair logo" />
      <h1>{{t('Sign in')}}</h1>
      <p class="muted">{{t('Sign in to your repair management workspace.')}}</p>
    </div>
    <form (ngSubmit)="submit()">
      <label for="auth-email">{{t('Email')}}
        <input id="auth-email" type="email" name="email" [(ngModel)]="email" autocomplete="username" required dir="ltr" />
      </label>
      <label for="auth-password">{{t('Password')}}
        <input id="auth-password" type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required dir="ltr" />
      </label>
      @if (error()) { <p class="error" role="alert">{{error()}}</p> }
      <button class="primary auth-submit" type="submit" [disabled]="busy()">{{busy() ? t('Signing in…') : t('Sign in')}}</button>
    </form>
    <nav class="auth-bottom-nav" aria-label="Account and site navigation">
      <div class="auth-account-card">
        <span class="auth-account-prompt">{{t('New here?')}}</span>
        <a class="auth-account-action" routerLink="/register">
          <span class="auth-account-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6M17 11h6"/></svg></span>
          <span>{{t('Create an account')}}</span>
          <svg aria-hidden="true" class="auth-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </div>
      <div class="auth-nav-grid">
        <a class="auth-nav-tile" routerLink="/about">
          <span class="auth-nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
          <span>{{t('About Wolf Tech Repair')}}</span>
        </a>
        <a class="auth-nav-tile" routerLink="/">
          <span class="auth-nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span>
          <span>{{t('← Back to home')}}</span>
        </a>
      </div>
    </nav>
  </section>
</main>
